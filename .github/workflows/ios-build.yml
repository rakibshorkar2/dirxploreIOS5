name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # We initialize manually to sync first

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install libtorrent build dependencies
        run: brew install boost cmake openssl@3

      - name: Build native libtorrent library
        run: |
          bash scripts/build-libtorrent-ios.sh

      - run: flutter pub get

      - name: Determine version and build number
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          NAME="${VERSION%%+*}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}+${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build iOS
        run: flutter build ios --release --no-codesign --build-name "${{ steps.app_version.outputs.build_name }}" --build-number "${{ steps.app_version.outputs.build_number }}"

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr build/ios/iphoneos/Runner.ipa Payload/
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ios-build-output
          path: |
            build/ios/iphoneos/Runner.ipa
            build/ios/iphoneos/Runner.app.dSYM.zip
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.app_version.outputs.tag }}"
          TITLE="DirXplore ${{ steps.app_version.outputs.build_name }} (${{ steps.app_version.outputs.build_number }})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/ios/iphoneos/Runner.ipa --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "Automated release from commit ${{ github.sha }}"
          else
            gh release create "$TAG" \
              build/ios/iphoneos/Runner.ipa \
              --title "$TITLE" \
              --notes "Automated release from commit ${{ github.sha }}"
          fi
