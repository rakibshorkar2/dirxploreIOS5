name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract app version
        id: app_version
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          BUILD="${{ github.run_number }}"
          echo "build_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=${NAME}+${BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}+${BUILD}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - run: |
          flutter build ios --release --no-codesign \
            --build-name "${{ steps.app_version.outputs.build_name }}" \
            --build-number "${{ steps.app_version.outputs.build_number }}"

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr build/ios/iphoneos/Runner.ipa Payload/
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ios-build-output
          path: |
            build/ios/iphoneos/Runner.ipa
            build/ios/iphoneos/Runner.app.dSYM.zip
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.app_version.outputs.tag }}"
          FILES="build/ios/iphoneos/Runner.ipa"
          if [ -f build/ios/iphoneos/Runner.app.dSYM.zip ]; then
            FILES="$FILES build/ios/iphoneos/Runner.app.dSYM.zip"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, recreating with fresh assets."
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" $FILES \
            --title "DirXplore ${{ steps.app_version.outputs.version }}" \
            --notes "Automated release from commit ${{ github.sha }}"
          echo "Released $TAG"
