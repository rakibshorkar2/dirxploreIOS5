name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies (cmake, ninja)
        run: brew install cmake ninja

      - name: Install Boost 1.85 headers (libtorrent 1.2 needs boost < 1.87)
        run: |
          curl -sL https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.gz -o /tmp/boost_1_85_0.tar.gz
          mkdir -p /tmp/boost
          tar -xzf /tmp/boost_1_85_0.tar.gz -C /tmp/boost --strip-components=1
          sudo rm -rf /opt/homebrew/include/boost
          sudo cp -R /tmp/boost/boost /opt/homebrew/include/

      - name: Clone libtorrent (pinned v1.2.20)
        run: |
          rm -rf ios/Torrent/LibTorrent-Swift/Thirdparty/libtorrent
          git clone --recurse-submodules --branch v1.2.20 --depth 1 \
            https://github.com/arvidn/libtorrent.git \
            ios/Torrent/LibTorrent-Swift/Thirdparty/libtorrent

      - name: Build LibTorrent Submodule
        env:
          BOOST_INCLUDEDIR: /tmp/boost
        run: |
          chmod +x ./ios/Torrent/LibTorrent-Swift/make.sh
          ./ios/Torrent/LibTorrent-Swift/make.sh

      - name: Pre-build LibTorrent Framework
        run: |
          xcodebuild -quiet \
            -project ios/Torrent/LibTorrent-Swift/libtorrent-build/libtorrent.xcodeproj \
            -target torrent-rasterbar \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build
          xcodebuild -quiet \
            -project ios/Torrent/LibTorrent-Swift/LibTorrent.xcodeproj \
            -scheme LibTorrent \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/Torrent/LibTorrent-Swift/build \
            CODE_SIGNING_ALLOWED=NO build

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr build/ios/iphoneos/Runner.ipa Payload/
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ios-build-output
          path: |
            build/ios/iphoneos/Runner.ipa
            build/ios/iphoneos/Runner.app.dSYM.zip
          retention-days: 7

      - name: Extract app version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.app_version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              build/ios/iphoneos/Runner.ipa \
              --title "DirXplore ${{ steps.app_version.outputs.version }}" \
              --notes "Automated release from commit ${{ github.sha }}"
          fi
